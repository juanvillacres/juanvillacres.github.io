{{ $posts := where site.RegularPages "Section" "posts" }}<div class="news-list">{{ range first 3 $posts.ByDate.Reverse }}<article class="news-item"><p class="mono muted">{{ .Params.datelabel | default (.Date.Format "January 2006") }}</p><div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | truncate 155 }}</p></div><a class="text-link" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">Read <span aria-hidden="true">↗</span></a></article>{{ end }}</div>
