<article class="publication" data-year="{{ .pub.year }}" data-type="{{ .pub.type }}" data-topic="{{ .pub.topic }}">
  <div class="publication-main"><p class="pub-meta">{{ if .featured }}<span>{{ .pub.year }}</span>{{ end }}<span>{{ .pub.type }}</span><span>{{ .pub.topic }}</span></p><h3><a href="{{ .pub.url }}">{{ .pub.title }}</a></h3><p class="pub-authors">{{ .pub.authors }}</p><p class="pub-venue">{{ .pub.venue }}</p></div>
  <div class="pub-actions"><a class="text-link" href="{{ .pub.url }}" aria-label="Read {{ .pub.title }}">Paper <span aria-hidden="true">↗</span></a><button class="copy-citation" type="button" hidden data-citation="{{ .pub.authors }} ({{ .pub.year }}). {{ .pub.title }}. {{ .pub.venue }}. {{ .pub.url }}" aria-label="Copy citation for {{ .pub.title }}">Copy citation</button></div>
</article>
