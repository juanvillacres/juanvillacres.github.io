<header class="site-header">
<div class="shell header-inner">
<a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Data.profile.name }}</a>
<div class="header-controls">
<button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme" hidden><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 15a8.5 8.5 0 0 1-11-11 9 9 0 1 0 11 11Z"/></svg></button>
<button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>
<nav id="site-nav" class="site-nav" aria-label="Main navigation">
{{ range site.Menus.main }}{{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}{{ if eq .Name "About" }}{{ $active = $.IsHome }}{{ end }}<a href="{{ .URL }}"{{ if $active }} class="active"{{ end }}{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
</nav>
</div>
</header>
